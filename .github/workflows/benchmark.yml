name: Benchmark

# Unit tests for the benchmark harness.
#
# The benchmark itself cannot run here: simulation invokes Badread, minimap2 and
# a variant caller, all conda-only. Rather than keep a parallel pure-Python
# imitation of that pipeline alive purely so CI has something to run, CI tests
# the parts that are computation and leaves the pipeline to `spbench check-env`
# on a machine that actually has it.
#
# What is covered here is the part where a silent bug would be invisible in a
# results table: the metrics, the abundance archetypes, and the derivation of
# ground truth from assembly-to-reference alignment.

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  harness-tests:
    name: Benchmark harness tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install strainphase and the benchmark harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install -e ./benchmark

      - name: Unit tests
        working-directory: benchmark
        run: pytest tests -v

      - name: Workflow DAG builds
        working-directory: benchmark
        run: |
          pip install snakemake
          # Fixture assemblies: the DAG shape does not depend on their content,
          # and the real ones are the user's data.
          python - <<'EOF'
          import numpy as np
          from spbench.strains import write_fasta
          rng = np.random.default_rng(0)
          backbone = "".join(rng.choice(list("ACGT"), size=20000).tolist())
          for i, name in enumerate(["s1", "s2", "s3"]):
              seq = list(backbone)
              for p in rng.choice(20000, size=100 * (i + 1), replace=False):
                  seq[p] = next(b for b in "ACGT" if b != seq[p])
              write_fasta(f"assemblies/ci/{name}.fasta", {"chr": "".join(seq)})
          EOF
          snakemake -s workflow/Snakefile --dry-run \
            --config groups='{"ci": "assemblies/ci"}' seeds='[0]'

      - name: Ground truth from assemblies runs end to end
        working-directory: benchmark
        run: |
          snakemake -s workflow/Snakefile --cores 2 \
            --config groups='{"ci": "assemblies/ci"}' seeds='[0]' \
            results/datasets/ci.seed0/plan.tsv
          cat results/datasets/ci.seed0/manifest.json
