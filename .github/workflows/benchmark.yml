name: Benchmark

# Unit tests for the benchmark harness.
#
# The benchmark itself cannot run here: simulation invokes Badread, minimap2 and
# a variant caller, all conda-only. Rather than keep a parallel pure-Python
# imitation of that pipeline alive purely so CI has something to run, CI tests
# the parts that are computation and leaves the pipeline to `spbench check-env`
# on a machine that actually has it.
#
# What is covered here is the part where a silent bug would be invisible in a
# results table: the metrics, the abundance archetypes, and the derivation of
# ground truth from assembly-to-reference alignment.

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  harness-tests:
    name: Benchmark harness tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install strainphase and the benchmark harness
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install -e ./benchmark

      - name: Unit tests
        working-directory: benchmark
        run: pytest tests -v

      - name: Config files parse and expand
        working-directory: benchmark
        run: |
          python -m spbench.cli plan -c configs/example.yaml
          echo "work units: $(python -m spbench.cli plan -c configs/example.yaml --count)"

      - name: Comparator adapters resolve
        working-directory: benchmark
        run: python -m spbench.cli check-tools || true
