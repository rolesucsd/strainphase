# Strainy: phasing and assembly of strain haplotypes from long-read metagenomes.
#   Kazantseva, Donmez, Frolova, Pop & Kolmogorov. Nature Methods, 2024.
#   https://github.com/katerinakazantseva/strainy
#
# Strainy pulls a large dependency tree (flye, minimap2, samtools, bcftools).
# Keeping it isolated is not optional in practice.
name: strainy
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - strainy>=1.1
  - samtools>=1.17
  - minimap2>=2.24
  - flye>=2.9
