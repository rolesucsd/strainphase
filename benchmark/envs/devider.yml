# devider: haplotyping of small sequences (viruses, plasmids, single genes) from
# long reads via a positional de Bruijn graph over informative alleles.
#   Shaw & Yu, 2025. https://github.com/bluenote-1577/devider
#
# Included as a strong short-span comparator, not as a whole-MAG competitor -
# see the `designed_for` note printed in the benchmark report.
name: devider
channels:
  - conda-forge
  - bioconda
dependencies:
  - devider>=0.1
  - samtools>=1.17
  - minimap2>=2.24
