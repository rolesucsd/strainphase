# Everything the benchmark needs except the two comparators, which get their own
# environments (Floria and Strainy have conflicting pins).
#
# Simulation now runs real tools end to end: Badread makes the reads, your
# aligner makes the BAM, your caller makes the VCF. So this environment has to
# contain the pipeline, not just the harness.
name: spbench
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # Harness
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - networkx>=3.0
  - matplotlib-base>=3.7
  - pyyaml>=6.0
  - pysam>=0.22
  - python-louvain>=0.16
  - pytest>=7.4
  - mappy>=2.24          # assembly-to-reference alignment for ground truth
  # Pipeline
  - badread>=0.4.1       # read simulation; what Strainy's HiFi benchmark used
  - minimap2>=2.24
  - samtools>=1.17
  - htslib>=1.17
  # Variant calling. Swap for whatever your workflow uses and update call_cmd.
  - clair3>=1.0
  - pip
