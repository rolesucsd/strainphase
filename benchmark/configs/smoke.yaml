# Smoke tier: the fastest useful run. Target ~2-5 minutes on a laptop, no
# downloads, no external tools, no conda. This is what CI runs on every push and
# what you should run first after cloning to confirm the harness works.
#
# It is small enough that the absolute numbers are noisy - one seed, one small
# contig - so treat it as a functional check, not as evidence. Use
# configs/standard.yaml for numbers you would put in a figure.

name: smoke
description: >
  Minimal end-to-end check. One synthetic reference, three strains including one
  rare-and-blooming strain, three timepoints. Runs only the tools that need no
  external binaries.

seeds: [0]
threads: 2
match_threshold: 0.99
min_shared_sites: 10

tools:
  - naive-greedy
  - strainphase-single
  - strainphase-longitudinal

datasets:
  - name: smoke-3strain
    n_strains: 3
    n_mutations: 300
    contig_length: 60000
    n_timepoints: 3
    coverage: 30
    mean_read_length: 8000
    read_length_sd: 2000
    min_read_length: 3000
    max_read_length: 15000
    error_rate: 0.001
    include_sweep: true
    include_rescue_strain: true
    vcf_mode: called
