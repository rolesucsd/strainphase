# Standard tier: the configuration behind the reported figures.
#
# Sweeps the three axes that actually change the answer - how many strains, how
# divergent they are, and how deeply they were sequenced - with three replicate
# seeds each so differences between tools can be separated from differences
# between random draws.
#
# Cost: 3 seeds x 9 datasets x N tools. On 8 cores this is a few hours with the
# built-in tools, longer with Floria/Strainy/devider installed. Run
# `spbench check-tools -c configs/standard.yaml` first.

name: standard
description: >
  Strain count x divergence x coverage sweep, four timepoints, three replicate
  seeds. Every dataset contains one strain that blooms at a single timepoint and
  sits near the single-sample detection floor at the others.

seeds: [0, 1, 2]
threads: 8

# Reads are given HiFi-shaped error (homopolymer-concentrated indels plus
# substitutions), sequenced from both strands, and aligned back to the reference
# with minimap2. Placement, CIGAR and MAPQ come from the aligner, so indel
# placement ambiguity and soft clipping are present and identical for every
# tool. See spbench/hifi.py for what this models and what it still does not.
read_model: &read_model hifi
aligner: &aligner minimap2
match_threshold: 0.99
min_shared_sites: 10

tools:
  # Baseline floor. If a method cannot beat this, the dataset is too easy.
  - naive-greedy
  # The like-for-like row: strainphase with cross-timepoint rescue off.
  - strainphase-single
  # The claim.
  - strainphase-longitudinal
  # Third-party single-sample phasers. Skipped with a message if not installed.
  - floria
  - strainy
  - devider
  # Diploid phaser, meaningful only at n_strains = 2. Included because the
  # question "why not just use a standard phaser" deserves a measured answer.
  - whatshap-diploid

datasets:
  # --- strain count, at fixed divergence and coverage -----------------------
  - name: k2-div5-cov30
    n_strains: 2
    n_mutations: 1000
    contig_length: 200000
    coverage: 30
    read_model: *read_model
    aligner: *aligner
  - name: k4-div5-cov30
    n_strains: 4
    n_mutations: 1000
    contig_length: 200000
    coverage: 30
    read_model: *read_model
    aligner: *aligner
  - name: k8-div5-cov30
    n_strains: 8
    n_mutations: 1000
    contig_length: 200000
    coverage: 30
    read_model: *read_model
    aligner: *aligner

  # --- divergence, at fixed strain count and coverage -----------------------
  # 200 mutations over 200 kb is ~0.1% divergence: close to the resolution limit
  # for read-based phasing and the regime where methods separate.
  - name: k4-div1-cov30
    n_strains: 4
    n_mutations: 200
    contig_length: 200000
    coverage: 30
    read_model: *read_model
    aligner: *aligner
  - name: k4-div10-cov30
    n_strains: 4
    n_mutations: 2000
    contig_length: 200000
    coverage: 30
    read_model: *read_model
    aligner: *aligner

  # --- coverage, at fixed strain count and divergence -----------------------
  - name: k4-div5-cov10
    n_strains: 4
    n_mutations: 1000
    contig_length: 200000
    coverage: 10
    read_model: *read_model
    aligner: *aligner
  - name: k4-div5-cov60
    n_strains: 4
    n_mutations: 1000
    contig_length: 200000
    coverage: 60
    read_model: *read_model
    aligner: *aligner

  # --- indels, to exercise the CIGAR-aware paths ---------------------------
  - name: k4-div5-cov30-indels
    n_strains: 4
    n_mutations: 1000
    contig_length: 200000
    coverage: 30
    indel_fraction: 0.1
    read_model: *read_model
    aligner: *aligner

  # --- perfect variant calls, as an ablation of the calling step ------------
  # Everything else uses a simulated caller with realistic false negatives at
  # low abundance. This row isolates how much of each tool's low-abundance loss
  # comes from the caller rather than from the phasing.
  - name: k4-div5-cov30-truthvcf
    n_strains: 4
    n_mutations: 1000
    contig_length: 200000
    coverage: 30
    vcf_mode: truth
    read_model: *read_model
    aligner: *aligner

  # --- realism ablation ----------------------------------------------------
  # Identical to k4-div5-cov30 except that reads are emitted at their true
  # coordinates with exact CIGARs and substitution-only error, the way most
  # phasing benchmarks (including this project's previous one) simulate.
  #
  # The gap between this row and k4-div5-cov30 is the answer to "how much of
  # each tool's score came from the simulation being clean?" - which is the
  # question a reviewer should ask of any simulated phasing benchmark, and one
  # almost none of them answer.
  - name: k4-div5-cov30-exactreads
    n_strains: 4
    n_mutations: 1000
    contig_length: 200000
    coverage: 30
    read_model: exact
    aligner: exact
