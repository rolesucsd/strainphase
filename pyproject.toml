[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strainphase"
version = "0.1.0rc1"
description = "Hybrid graph-probabilistic haplotype reconstruction for PacBio HiFi metagenomic data"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Renee Oles", email = "roles@ucsd.edu"}
]
keywords = [
    "metagenomics",
    "haplotype",
    "strain",
    "microbiome",
    "pacbio",
    "hifi",
    "longitudinal",
    "IBD",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "networkx>=2.6",
    "python-louvain>=0.16",
    # Not optional: strainphase/__init__.py imports strainphase.longitudinal,
    # which imports pysam at module level, so `import strainphase` fails without
    # it. It was previously in the "full" extra, which made every plain
    # `pip install strainphase` a broken install.
    "pysam>=0.19",
]

[project.optional-dependencies]
# Retained so an existing `pip install strainphase[full]` keeps resolving. pysam
# moved into the core dependencies, so this now adds nothing.
full = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = [
    "strainphase[full,dev]",
]

[project.urls]
Homepage = "https://github.com/rolesucsd/strainphase"
Repository = "https://github.com/rolesucsd/strainphase"
Issues = "https://github.com/rolesucsd/strainphase/issues"

[project.scripts]
strainphase = "strainphase.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# archive/ and benchmark/ are gitignored working directories, but a source tree
# on disk still has them and archive/benchmarks/ contains an __init__.py, so
# setuptools would otherwise pick it up and ship it inside the wheel.
exclude = ["tests*", "docs*", "archive*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
